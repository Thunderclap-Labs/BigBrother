<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BigBrother{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="bg-grid"></div>

    <nav class="navbar">
        <div class="nav-brand">
            <img src="{{ url_for('static', filename='crosshair.png') }}" alt="" class="nav-icon" onerror="this.style.display='none'">
            <span class="nav-title glitch" data-text="BIGBROTHER">BIGBROTHER</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Dashboard</a>
            <a href="/camera" class="nav-link {% if request.path == '/camera' %}active{% endif %}">Camera</a>
            <a href="/stats" class="nav-link {% if request.path == '/stats' %}active{% endif %}">Stats</a>
            <a href="/settings" class="nav-link {% if request.path == '/settings' %}active{% endif %}">Settings</a>
        </div>
        <div class="nav-clock" id="nav-clock">00:00:00</div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        BigBrother v0.1 &mdash; Always Watching.
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
    // Live clock
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2,'0');
        const m = String(now.getMinutes()).padStart(2,'0');
        const s = String(now.getSeconds()).padStart(2,'0');
        const el = document.getElementById('nav-clock');
        if (el) el.textContent = h + ':' + m + ':' + s;
    }
    updateClock();
    setInterval(updateClock, 1000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
